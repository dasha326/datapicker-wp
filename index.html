<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Date Picker</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.5s;
            width: 229px;
            height: 60px;
            font-size: 14px;
            color: black;
            border-radius: 29px;
            background-color: #ffdd00;
            border: 1px solid #ffdd00;
        }
        .meeting-calendar {
            background-color: #fff;
            box-shadow: 0 -11px 54.1px 0 rgba(0, 0, 0, 0.15);
            border-radius: 20px;
            max-width: 400px;
            padding: 20px;
        }
        .meeting-calendar__bottom {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #E2E2E2;
            padding-top: 13px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div class="meeting-calendar" data-meeting="parent">
    <div id="datepicker" class="datepicker">
        <div class="datepicker-container"></div>
    </div>
    <div class="meeting-calendar__bottom">
        <input type="text" id="datepicker-input" readonly placeholder="Выберите дату">
        <button class="meeting-calendar__btn btn" data-meeting="button">Записаться</button>
    </div>
</div>
<script>
    const meetingCalendars = document.querySelectorAll('[data-meeting="parent"]');
    if (meetingCalendars.length) {
        meetingCalendars.forEach(meetingCalendar => {
            const button = meetingCalendar.querySelector('[data-meeting="button"]');
            const input = meetingCalendar.querySelector('input')
            button.addEventListener('click', () => {
                const inputValue = input.value;
                fetch('/your-api-endpoint', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({date: inputValue})
                })
                    .then(response => {
                        if (response.ok) {
                            console.log('Данные успешно отправлены');
                        } else {
                            console.error('Ошибка при отправке данных');
                        }
                    })
                    .catch(error => {
                        console.error('Произошла ошибка:', error);
                    });
            })
        })
    }
</script>

<script src="/assets/scripts.js"></script>
</body>
</html>
