<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Date Picker</title>
    <style>
        /* Основные стили */
        .datepicker-container {
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow: hidden; /* Важно для скрытия скролла */
            font-family: sans-serif;
        }

        .datepicker-header {
            background-color: #f0f0f0;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        .datepicker-body {
            display: flex;
        }

        .datepicker-months {
            width: 100px;
            overflow-y: scroll; /* Добавляем скролл */
            height: 200px; /* Ограничиваем высоту для скролла */
            border-right: 1px solid #ccc;
        }

        .datepicker-months::-webkit-scrollbar { /* Стилизация скроллбара (для Chrome, Safari) */
            width: 5px;
        }

        .datepicker-months::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .datepicker-months::-webkit-scrollbar-thumb {
            background: #888;
        }

        .datepicker-months::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .month-item {
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .month-item:hover {
            background-color: #eee;
        }

        .month-item.selected {
            background-color: #add8e6; /* Light Blue */
            font-weight: bold;
        }


        .datepicker-days {
            flex-grow: 1;
            padding: 10px;
        }

        .datepicker-days-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .datepicker-days-body {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .day-item {
            padding: 5px;
            text-align: center;
            cursor: pointer;
            border-radius: 50%; /* Круглые дни */
            transition: background-color 0.2s;
        }

        .day-item:hover {
            background-color: #eee;
        }

        .day-item.selected {
            background-color: #007bff;  /* Blue */
            color: white;
        }

        .day-item.disabled {
            color: #ccc;
            cursor: default;
        }
    </style>
</head>
<body>

<div id="datepicker" class="datepicker-container">
</div>

<script>
    // Получаем текущую дату
    let currentDate = new Date();
    let selectedDate = null; // Храним выбранную дату

    // Массив названий месяцев
    const monthNames = [
        "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
        "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
    ];

    // Массив названий дней недели
    const dayNames = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];

    // DOM элементы
    const datepickerContainer = document.getElementById("datepicker");
    let monthList; // Переменная для хранения элемента списка месяцев
    let dayGrid;    // Переменная для хранения элемента сетки дней

    // Функция для генерации списка месяцев
    function generateMonthList() {
        const monthContainer = document.createElement("div");
        monthContainer.classList.add("datepicker-months");

        for (let i = 0; i < monthNames.length; i++) {
            const monthItem = document.createElement("div");
            monthItem.classList.add("month-item");
            monthItem.textContent = monthNames[i];
            monthItem.dataset.monthIndex = i; // Сохраняем индекс месяца
            monthItem.addEventListener("click", () => {
                currentDate.setMonth(parseInt(monthItem.dataset.monthIndex));
                updateDayGrid();
                updateMonthSelection(parseInt(monthItem.dataset.monthIndex));
            });
            monthContainer.appendChild(monthItem);
        }
        return monthContainer;
    }

    // Функция для обновления выделения месяца
    function updateMonthSelection(monthIndex) {
        const monthItems = document.querySelectorAll(".month-item");
        monthItems.forEach(item => {
            if (parseInt(item.dataset.monthIndex) === monthIndex) {
                item.classList.add("selected");
            } else {
                item.classList.remove("selected");
            }
        });
    }

    // Функция для генерации сетки дней
    function generateDayGrid(year, month) {
        const dayContainer = document.createElement("div");
        dayContainer.classList.add("datepicker-days");

        // Заголовок с названиями дней недели
        const header = document.createElement("div");
        header.classList.add("datepicker-days-header");
        dayNames.forEach(day => {
            const dayHeader = document.createElement("div");
            dayHeader.textContent = day;
            header.appendChild(dayHeader);
        });
        dayContainer.appendChild(header);

        // Расчет первого дня месяца и количества дней
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0); // 0 - последний день предыдущего месяца
        const daysInMonth = lastDay.getDate();
        const firstDayOfWeek = firstDay.getDay(); // 0 - воскресенье, 6 - суббота

        // Создание ячеек сетки
        const body = document.createElement("div");
        body.classList.add("datepicker-days-body");

        // Заполнение пустыми ячейками до первого дня месяца
        for (let i = 0; i < firstDayOfWeek; i++) {
            const emptyDay = document.createElement("div");
            body.appendChild(emptyDay);
        }

        // Заполнение днями месяца
        for (let day = 1; day <= daysInMonth; day++) {
            const dayItem = document.createElement("div");
            dayItem.classList.add("day-item");
            dayItem.textContent = day;
            dayItem.dataset.day = day; // Сохраняем номер дня
            dayItem.dataset.month = month; // Сохраняем номер месяца
            dayItem.dataset.year = year;    // Сохраняем год

            // Отключение дней, предшествующих текущей дате (по желанию)
            // if (year < currentDate.getFullYear() ||
            //     (year === currentDate.getFullYear() && month < currentDate.getMonth()) ||
            //     (year === currentDate.getFullYear() && month === currentDate.getMonth() && day < currentDate.getDate())) {
            //   dayItem.classList.add("disabled");
            //   dayItem.classList.remove("selected"); // Снимаем выделение с неактивных дат
            //   dayItem.dataset.day = null;
            //   dayItem.dataset.month = null;
            //   dayItem.dataset.year = null;
            // } else {
            dayItem.addEventListener("click", () => {
                const clickedYear = parseInt(dayItem.dataset.year);
                const clickedMonth = parseInt(dayItem.dataset.month);
                const clickedDay = parseInt(dayItem.dataset.day);

                selectedDate = new Date(clickedYear, clickedMonth, clickedDay);
                updateDaySelection(clickedYear, clickedMonth, clickedDay); // Обновление выделения выбранного дня
            });
            //}

            body.appendChild(dayItem);
        }

        dayContainer.appendChild(body);
        return dayContainer;
    }

    // Функция для обновления выделения дня
    function updateDaySelection(year, month, day) {
        const dayItems = document.querySelectorAll(".day-item");
        dayItems.forEach(item => {
            const itemYear = parseInt(item.dataset.year);
            const itemMonth = parseInt(item.dataset.month);
            const itemDay = parseInt(item.dataset.day);

            if (itemYear === year && itemMonth === month && itemDay === day) {
                item.classList.add("selected");
            } else {
                item.classList.remove("selected");
            }
        });
    }

    // Функция для обновления сетки дней (вызывается при выборе месяца)
    function updateDayGrid() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        dayGrid.remove(); // Удаляем старую сетку дней
        dayGrid = generateDayGrid(year, month); // Генерируем новую сетку дней
        datepickerContainer.querySelector(".datepicker-body").appendChild(dayGrid); // Добавляем новую сетку в DOM

        updateMonthSelection(month); // Обновляем выделение месяца
        if (selectedDate) {
            updateDaySelection(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate()); // Обновляем выделение выбранной даты
        }
    }

    // Функция для отрисовки datepicker
    function renderDatepicker() {
        // Очищаем предыдущее содержимое
        datepickerContainer.innerHTML = "";

        // Заголовок
        const header = document.createElement("div");
        header.classList.add("datepicker-header");
        header.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
        datepickerContainer.appendChild(header);

        // Тело datepicker (месяцы и дни)
        const body = document.createElement("div");
        body.classList.add("datepicker-body");
        monthList = generateMonthList();
        dayGrid = generateDayGrid(currentDate.getFullYear(), currentDate.getMonth());
        body.appendChild(monthList);
        body.appendChild(dayGrid);
        datepickerContainer.appendChild(body);

        // Инициализация выделения текущего месяца
        updateMonthSelection(currentDate.getMonth());
    }


    // Инициализация при загрузке страницы
    renderDatepicker();
</script>

</body>
</html>
